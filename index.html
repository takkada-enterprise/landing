    <!-- Self-hosted fonts (src/fonts.css). Do not re-add a Google Fonts
         <link>: it was render-blocking for 1.3s.

         And do NOT preload these fonts. That was tried and measured, and it
         made things worse: preloading the two latin files put 93KB of
         High-priority requests in front of the hero image, which is the LCP
         element. Once the fonts were served from our own origin they competed
         with it for the same connection instead of arriving over Google's, and
         the hero's download time went 1,728ms -> 3,120ms for identical bytes.
         Live mobile LCP regressed 2.6-2.9s -> 3.1-4.2s.

         font-display: swap already renders text immediately in a fallback and
         swaps when the font lands, which is the right trade for a page whose
         LCP is an image. Measure before changing this.

         Guards in src/__tests__/fonts.test.js. -->

    <script type="text/javascript">
      if (
        typeof window !== 'undefined' &&
        !['localhost', '127.0.0.1'].includes(window.location.hostname) &&
        !window.location.hostname.startsWith('192.168.') &&
        !window.location.hostname.startsWith('10.') &&
        !window.location.hostname.endsWith('.local')
      ) {
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "x3qmzef9tl");
      }
    </script>

    <!-- Meta Pixel (Takkada dataset). Same local-host guard as Clarity so dev
         sessions never reach the ad account.

         Leads: a click on any link to the demo calendar or to WhatsApp
         (wa.me / api.whatsapp.com) counts once. Matching on the link target
         rather than the button text keeps every page covered, the feature
         pages included. The phone modal opens the calendar with window.open
         instead of a link, so it fires its own Lead via trackMetaLead() in
         src/lib/track.js.

         PageView: the pixel fires one on load and, by itself, one on every
         client-side route change (it listens to history.pushState), so the
         router needs no extra call. Adding one would double-count. -->
    <script>
      if (
        typeof window !== 'undefined' &&
        !['localhost', '127.0.0.1'].includes(window.location.hostname) &&
        !window.location.hostname.startsWith('192.168.') &&
        !window.location.hostname.startsWith('10.') &&
        !window.location.hostname.endsWith('.local')
      ) {
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1485519606341338');
        fbq('track', 'PageView');

        document.addEventListener('click', function (e) {
          var a = e.target.closest && e.target.closest('a');
          if (!a || !a.href) return;
          if (a.href.indexOf('calendar.notion.so') > -1) {
            fbq('track', 'Lead', { content_name: 'book_demo_click' });
          } else if (a.href.indexOf('wa.me/') > -1 || a.href.indexOf('api.whatsapp.com') > -1) {
            fbq('track', 'Lead', { content_name: 'whatsapp_click' });
          }
        }, true);
      }
    </script>
