    <!-- Self-hosted fonts (src/fonts.css). Do not re-add a Google Fonts
         <link>: it was render-blocking for 1.3s.

         And do NOT preload these fonts. That was tried and measured, and it
         made things worse: preloading the two latin files put 93KB of
         High-priority requests in front of the hero image, which is the LCP
         element. Once the fonts were served from our own origin they competed
         with it for the same connection instead of arriving over Google's, and
         the hero's download time went 1,728ms -> 3,120ms for identical bytes.
         Live mobile LCP regressed 2.6-2.9s -> 3.1-4.2s.

         font-display: swap already renders text immediately in a fallback and
         swaps when the font lands, which is the right trade for a page whose
         LCP is an image. Measure before changing this.

         Guards in src/__tests__/fonts.test.js. -->

    <script type="text/javascript">

        typeof window !== 'undefined' &&
        !['localhost', '127.0.0.1'].includes(window.location.hostname) &&
