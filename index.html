<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 180x64, 13KB. This pointed at the 1172px source PNG, so every visitor
         on every page downloaded 133KB for a tab icon. The full-size PNG stays
         in the repo as the schema.org logo URL, which browsers never fetch. -->
    <link rel="icon" type="image/png" href="/assets/screenshots/takkada-favicon.png" />
    <!-- Self-hosted fonts. Do not re-add a Google Fonts <link>: it was
         render-blocking for 1.3s. Rationale in src/fonts.css, guards in
         src/__tests__/fonts.test.js. Only `latin` is preloaded on purpose. -->
    <link
      rel="preload"
      href="/assets/fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "x3qmzef9tl");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
